<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HitOrder – Scanner</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e0d12">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0e0d12; --surface: #1a1921; --border:  #2d2b3d;
      --accent:  #f0b429; --green:   #1DB954; --red:     #e8574a;
      --text:    #ece8f0; --muted:   #7e7a93;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; max-width: 480px; margin: 0 auto; }

    /* Logo */
    .logo { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between; z-index: 50; }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 900; }
    .logo-text em { color: var(--accent); font-style: normal; }
    .logo-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* Video */
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0; transition: opacity .5s; }
    #video.ready { opacity: 1; }

    /* Overlay */
    .cam-overlay {
      position: fixed; inset: 0; z-index: 1;
      background: linear-gradient(to bottom,
        rgba(14,13,18,.85) 0%, rgba(14,13,18,.15) 28%,
        rgba(14,13,18,.15) 72%, rgba(14,13,18,.9) 100%);
    }

    /* Scan Rahmen */
    .scan-frame {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -56%);
      width: min(68vw, 240px); aspect-ratio: 1;
      z-index: 10;
    }
    .c { position: absolute; width: 26px; height: 26px; border-color: var(--accent); border-style: solid; transition: border-color .25s; }
    .c.tl { top:0; left:0;  border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .c.tr { top:0; right:0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .c.bl { bottom:0; left:0;  border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .c.br { bottom:0; right:0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }
    .scan-frame.found .c { border-color: var(--green); }

    .scan-line {
      position: absolute; left: 8px; right: 8px; height: 2px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      border-radius: 1px; box-shadow: 0 0 8px rgba(240,180,41,.6);
      animation: scanMove 2s ease-in-out infinite;
    }
    .scan-frame.found .scan-line { background: linear-gradient(to right, transparent, var(--green), transparent); box-shadow: 0 0 12px rgba(29,185,84,.8); animation: none; top: 50%; }
    @keyframes scanMove { 0%{top:8px;opacity:.4} 50%{top:calc(100% - 10px);opacity:1} 100%{top:8px;opacity:.4} }

    .scan-hint {
      position: fixed; top: calc(50% - min(34vw, 120px) + 30px); left: 50%;
      transform: translate(-50%, 60px);
      z-index: 10; font-size: 13px; color: rgba(255,255,255,.5);
      text-align: center; white-space: nowrap; transition: color .2s;
    }
    .scan-hint.ok { color: var(--green); }
    .scan-hint.err { color: var(--red); }

    /* Bottom */
    .bottom { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 16px 20px 40px; z-index: 20; }

    .result-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 12px; opacity: 0; pointer-events: none;
      transform: translateY(8px); transition: opacity .3s, transform .3s;
    }
    .result-card.show { opacity: 1; pointer-events: all; transform: translateY(0); }
    .result-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(29,185,84,.15); border: 1px solid rgba(29,185,84,.25); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .result-info { flex: 1; min-width: 0; }
    .result-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 3px; }
    .result-text  { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-sub   { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .open-btn { background: var(--green); color: #fff; border: none; border-radius: 20px; padding: 9px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

    .main-btn {
      width: 100%; height: 52px; border-radius: 26px; border: none;
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: opacity .15s, transform .12s;
    }
    .main-btn:active { transform: scale(.97); }
    .main-btn.start   { background: var(--green); color: #fff; }
    .main-btn.running { background: var(--surface); border: 1.5px solid var(--border); color: var(--red); }

    /* Start screen */
    .start-screen {
      position: fixed; inset: 0; z-index: 30; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 80px 28px 40px; transition: opacity .4s;
    }
    .start-screen.hidden { opacity: 0; pointer-events: none; }
    .start-icon  { font-size: 70px; margin-bottom: 24px; }
    .start-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 900; text-align: center; margin-bottom: 10px; }
    .start-title em { color: var(--accent); font-style: normal; }
    .start-sub   { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.6; margin-bottom: 36px; max-width: 300px; }
    .start-btn   { width: 100%; max-width: 300px; height: 54px; border-radius: 27px; background: var(--green); border: none; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; }

    #canvas { display: none; }
  </style>
</head>
<body>

<div class="logo">
  <div>
    <div class="logo-text">Hit<em>Order</em></div>
    <div class="logo-sub">QR-Scanner</div>
  </div>
</div>

<video id="video" playsinline autoplay muted></video>
<canvas id="canvas"></canvas>
<div class="cam-overlay"></div>

<div class="scan-frame" id="scan-frame">
  <div class="scan-line"></div>
  <div class="c tl"></div><div class="c tr"></div>
  <div class="c bl"></div><div class="c br"></div>
</div>
<div class="scan-hint" id="hint">Karte ins Bild halten</div>

<div class="bottom">
  <div class="result-card" id="result-card">
    <div class="result-icon">🎵</div>
    <div class="result-info">
      <div class="result-label">Erkannt</div>
      <div class="result-text" id="res-title">–</div>
      <div class="result-sub"  id="res-sub">–</div>
    </div>
    <button class="open-btn" id="open-btn">Öffnen</button>
  </div>
  <button class="main-btn start" id="main-btn" onclick="toggleScan()">
    📷 Kamera starten
  </button>
</div>

<div class="start-screen" id="start-screen">
  <div class="start-icon">📷</div>
  <div class="start-title">QR-<em>Scanner</em></div>
  <div class="start-sub">Halte die Kamera auf einen HitOrder QR-Code – der Song startet automatisch.</div>
  <button class="start-btn" onclick="startScan()">Kamera starten</button>
</div>

<script>
// jsQR direkt einbetten als Fallback – CDN wird zuerst versucht
const JSQR_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';

const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d', { willReadFrequently: true });
const sf     = document.getElementById('scan-frame');
const hint   = document.getElementById('hint');
const mainBtn= document.getElementById('main-btn');

let scanning  = false;
let stream    = null;
let scanTimer = null;
let cooldown  = false;

// ── jsQR laden ──────────────────────────────────────────
function loadJsQR() {
  return new Promise((resolve, reject) => {
    if (window.jsQR) { resolve(); return; }
    const s = document.createElement('script');
    s.src = JSQR_CDN;
    s.onload  = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ── Kamera starten ──────────────────────────────────────
async function startScan() {
  document.getElementById('start-screen').classList.add('hidden');
  setHint('Lade Scanner…');

  try {
    await loadJsQR();
  } catch {
    setHint('jsQR konnte nicht geladen werden', 'err');
    return;
  }

  try {
    // Rückkamera bevorzugen, aber auf alle Kameras zurückfallen
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));

    video.srcObject = stream;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();

    video.classList.add('ready');
    scanning = true;
    mainBtn.className = 'main-btn running';
    mainBtn.innerHTML = '⏹ Scan stoppen';
    setHint('Karte ins Bild halten');
    scheduleScan();

  } catch(e) {
    setHint('Kamera-Zugriff verweigert', 'err');
    document.getElementById('start-screen').classList.remove('hidden');
  }
}

function stopScan() {
  scanning = false;
  clearTimeout(scanTimer);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.classList.remove('ready');
  video.srcObject = null;
  mainBtn.className = 'main-btn start';
  mainBtn.innerHTML = '📷 Kamera starten';
  setHint('Scan gestoppt');
}

function toggleScan() {
  if (scanning) stopScan();
  else startScan();
}

// ── Scan-Schleife (per setTimeout, nicht RAF) ───────────
// RAF läuft zu schnell und blockiert; alle 200ms reicht für QR
function scheduleScan() {
  if (!scanning) return;
  scanTimer = setTimeout(() => {
    doScan();
    scheduleScan();
  }, 200);
}

function doScan() {
  if (!scanning || video.readyState < 2 || video.videoWidth === 0) return;

  // Vollbild auf Canvas zeichnen
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

  // Erst normal, dann invertiert versuchen
  let code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
  if (!code) {
    code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'onlyInvert' });
  }

  if (code && code.data && !cooldown) {
    handleQR(code.data);
  }
}

// ── QR erkannt ──────────────────────────────────────────
function handleQR(url) {
  // Nur player.html URLs akzeptieren
  if (!url.includes('player.html')) {
    setHint('Kein HitOrder QR-Code', 'err');
    setTimeout(() => setHint('Karte ins Bild halten'), 2000);
    return;
  }

  cooldown = true;
  setTimeout(() => { cooldown = false; }, 3000);

  // Haptisches Feedback (falls verfügbar)
  try { navigator.vibrate && navigator.vibrate(80); } catch {}

  // Visuelles Feedback
  sf.classList.add('found');
  setHint('Erkannt! Öffne Player…', 'ok');
  setTimeout(() => { sf.classList.remove('found'); }, 2000);

  // Song-Info aus der URL lesen
  let title = '', sub = '';
  try {
    const u = new URL(url);
    const s = u.searchParams.get('s') || '';
    if (s) {
      const dec = decodeURIComponent(atob(s));
      const parts = dec.split('|');
      title = parts[0] || '';
      sub   = (parts[1] || '') + (parts[2] ? '  ·  ' + parts[2] : '');
    }
  } catch {}

  document.getElementById('res-title').textContent = title || 'Song erkannt';
  document.getElementById('res-sub').textContent   = sub   || url;
  document.getElementById('open-btn').onclick = () => { window.location.href = url; };
  document.getElementById('result-card').classList.add('show');

  // Kurze Pause, dann navigieren
  setTimeout(() => { window.location.href = url; }, 600);
}

// ── Hilfsfunktionen ─────────────────────────────────────
function setHint(msg, type = '') {
  hint.textContent = msg;
  hint.className   = 'scan-hint' + (type ? ' ' + type : '');
}
</script>
</body>
</html>
