<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hitzda – Player</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e0d12">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- SDK wird erst per JS geladen wenn alles bereit ist -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0e0d12; --surface: #1a1921; --border: #2d2b3d;
      --accent:  #f0b429; --green:   #1DB954;
      --red:     #e8574a; --text:    #ece8f0; --muted:  #7e7a93;
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif; overflow: hidden;
      max-width: 480px; margin: 0 auto;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%,  rgba(29,185,84,.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(240,180,41,.08) 0%, transparent 60%);
    }

    /* ── Logo ── */
    .logo {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; padding: 20px 24px 0;
      display: flex; align-items: center; justify-content: space-between; z-index: 10;
    }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 900; }
    .logo-text em { color: var(--accent); font-style: normal; }
    .logo-badge { font-size: 11px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; }

    /* ── Screens ── */
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 88px 24px 32px;
      transition: opacity .4s;
    }
    .screen.hidden { opacity: 0; pointer-events: none; }

    /* ── Auth ── */
    .auth-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px 24px; text-align: center;
      width: 100%; max-width: 320px;
    }
    .auth-icon  { font-size: 48px; margin-bottom: 16px; }
    .auth-title { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 8px; }
    .auth-sub   { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 24px; }
    .auth-btn   {
      width: 100%; height: 50px; border-radius: 25px;
      background: var(--green); border: none; color: #fff;
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }

    /* ── Player ── */
    .player-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }

    .blind-cover {
      width: 200px; height: 200px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 32px; position: relative; overflow: hidden;
    }
    .blind-cover::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(240,180,41,.06), rgba(29,185,84,.06));
    }
    .blind-cover .note { font-size: 60px; opacity: .18; z-index: 1; }
    .blind-cover .q    { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--muted); text-align: center; padding: 0 16px; z-index: 1; }

    /* Waveform */
    .waveform { display: flex; align-items: center; justify-content: center; gap: 3px; height: 44px; margin-bottom: 32px; }
    .wave-bar { width: 4px; border-radius: 3px; background: var(--green); animation: wavePulse 1.1s ease-in-out infinite; opacity: .75; }
    .wave-bar:nth-child(1)  { height:12px; animation-delay:0s }
    .wave-bar:nth-child(2)  { height:22px; animation-delay:.1s }
    .wave-bar:nth-child(3)  { height:34px; animation-delay:.2s }
    .wave-bar:nth-child(4)  { height:44px; animation-delay:.15s }
    .wave-bar:nth-child(5)  { height:30px; animation-delay:.05s }
    .wave-bar:nth-child(6)  { height:40px; animation-delay:.25s }
    .wave-bar:nth-child(7)  { height:20px; animation-delay:.3s }
    .wave-bar:nth-child(8)  { height:36px; animation-delay:.1s }
    .wave-bar:nth-child(9)  { height:14px; animation-delay:.2s }
    .wave-bar:nth-child(10) { height:28px; animation-delay:.05s }
    .wave-bar:nth-child(11) { height:38px; animation-delay:.15s }
    .wave-bar:nth-child(12) { height:18px; animation-delay:.3s }
    .waveform.paused .wave-bar { animation-play-state: paused; opacity: .25; }
    @keyframes wavePulse { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1)} }

    /* Controls */
    .controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 24px; }
    .ctrl-btn { background: none; border: none; color: var(--muted); font-size: 26px; cursor: pointer; padding: 8px; transition: color .15s, transform .12s; }
    .ctrl-btn:active { transform: scale(.9); }
    .ctrl-btn:hover  { color: var(--text); }
    .play-btn {
      width: 68px; height: 68px; border-radius: 50%;
      background: var(--green); border: none; color: #fff; font-size: 26px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform .12s; box-shadow: 0 0 24px rgba(29,185,84,.3);
    }
    .play-btn:active { transform: scale(.93); }
    .play-btn.loading { background: #155e2e; pointer-events: none; }

    /* Progress */
    .progress-wrap { width: 100%; max-width: 300px; margin-bottom: 28px; }
    .prog-bg { width: 100%; height: 4px; background: var(--border); border-radius: 2px; cursor: pointer; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width .5s linear; width: 0%; }
    .prog-times { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }

    /* Reveal */
    .reveal-btn {
      width: 100%; max-width: 300px; height: 50px; border-radius: 25px;
      border: 1.5px solid var(--accent); background: rgba(240,180,41,.08);
      color: var(--accent); font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s;
    }
    .reveal-btn:hover { background: rgba(240,180,41,.18); }

    /* ── Lösung ── */
    .solution-panel {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(14,13,18,.96); backdrop-filter: blur(20px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    .solution-panel.show { opacity: 1; pointer-events: all; }
    .solution-card {
      background: var(--surface); border: 1px solid rgba(240,180,41,.3);
      border-radius: 24px; padding: 32px 24px; width: 100%; max-width: 340px; text-align: center;
      transform: scale(.88) translateY(20px);
      transition: transform .35s cubic-bezier(.34,1.4,.64,1);
    }
    .solution-panel.show .solution-card { transform: scale(1) translateY(0); }
    .solution-label  { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); margin-bottom: 20px; }
    .solution-year   {
      display: inline-block; background: linear-gradient(135deg, var(--accent), #c48f18);
      border-radius: 10px; padding: 8px 20px; margin-bottom: 18px;
      font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700;
      color: #1a1100; box-shadow: 0 4px 16px rgba(240,180,41,.3);
    }
    .solution-title  { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; line-height: 1.2; margin-bottom: 8px; }
    .solution-artist { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
    .sol-actions { display: flex; flex-direction: column; gap: 10px; }
    .sol-btn { width: 100%; height: 48px; border-radius: 24px; border: none; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
    .sol-continue { background: var(--green); color: #fff; }
    .sol-close    { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

    /* ── Error ── */
    .error-card {
      background: var(--surface); border: 1px solid rgba(232,87,74,.3);
      border-radius: 20px; padding: 32px 24px; text-align: center; width: 100%; max-width: 320px;
    }
    .error-icon  { font-size: 44px; margin-bottom: 12px; }
    .error-title { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 8px; }
    .error-sub   { font-size: 13px; color: var(--muted); line-height: 1.5; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { width: 22px; height: 22px; border: 2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation: spin .7s linear infinite; }
  </style>
</head>
<body>

<div class="logo">
  <div class="logo-text">Hit<em>Order</em></div>
  <div class="logo-badge">🎵 Raterunde</div>
</div>

<!-- Auth screen -->
<div class="screen" id="screen-auth">
  <div class="auth-card">
    <div class="auth-icon">🔐</div>
    <div class="auth-title">Spotify erforderlich</div>
    <div class="auth-sub">Melde dich mit Spotify Premium an um diesen Song zu hören.</div>
    <button class="auth-btn" onclick="doAuth()">Mit Spotify anmelden</button>
  </div>
</div>

<!-- Player screen -->
<div class="screen hidden" id="screen-player">
  <div class="player-wrap">
    <div class="blind-cover">
      <div class="note">♪</div>
      <div class="q">Welcher Song ist das?</div>
    </div>
    <div class="waveform paused" id="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="seekRel(-10000)" title="10s zurück">⏮</button>
      <button class="play-btn loading" id="play-btn" onclick="togglePlay()">
        <div class="spin" id="btn-spin"></div>
      </button>
      <button class="ctrl-btn" onclick="seekRel(10000)" title="10s vor">⏭</button>
    </div>
    <div class="progress-wrap">
      <div class="prog-bg" id="prog-bg" onclick="seekClick(event)">
        <div class="prog-fill" id="prog-fill"></div>
      </div>
      <div class="prog-times">
        <span id="t-cur">0:00</span>
        <span id="t-tot">–:––</span>
      </div>
    </div>
    <button class="reveal-btn" onclick="showSolution()">🔍 Lösung anzeigen</button>
  </div>
</div>

<!-- Error screen -->
<div class="screen hidden" id="screen-error">
  <div class="error-card">
    <div class="error-icon">😕</div>
    <div class="error-title" id="err-title">Fehler</div>
    <div class="error-sub"  id="err-sub">–</div>
  </div>
</div>

<!-- Solution overlay -->
<div class="solution-panel" id="solution-panel">
  <div class="solution-card">
    <div class="solution-label">🎉 Die Lösung</div>
    <div class="solution-year"   id="sol-year">2000</div>
    <div class="solution-title"  id="sol-title">–</div>
    <div class="solution-artist" id="sol-artist">–</div>
    <div class="sol-actions">
      <button class="sol-btn sol-continue" onclick="closeSolution()">▶ Song weiterhören</button>
      <button class="sol-btn sol-close"    onclick="closeSolution()">Schließen</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// HITORDER LOGGER
// Persistenter Log via localStorage, sichtbar in allen Seiten
// ══════════════════════════════════════════════════════
const HLog = (() => {
  const KEY      = 'hitorder_log';
  const MAX      = 400;
  const PAGE     = document.title.includes('Player') ? 'PLAYER' : 'MAIN';

  // ── Intern ────────────────────────────────────────────
  function _load()  { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } }
  function _save(e) { try { localStorage.setItem(KEY, JSON.stringify(e)); } catch {
    // localStorage voll – älteste Hälfte löschen
    const trimmed = e.slice(Math.floor(e.length / 2));
    try { localStorage.setItem(KEY, JSON.stringify(trimmed)); } catch {}
  }}

  function _add(level, tag, msg, detail) {
    const entries = _load();
    const now = new Date();
    const ts = now.toTimeString().slice(0,8) + '.' + String(now.getMilliseconds()).padStart(3,'0');
    entries.push({ ts, page: PAGE, level, tag, msg, detail: detail || null });
    if (entries.length > MAX) entries.splice(0, entries.length - MAX);
    _save(entries);
    // Konsole
    const prefix = `[${ts}] [${level}] [${tag}]`;
    if (level === 'ERR')  console.error(prefix, msg, detail || '');
    else if (level === 'WARN') console.warn(prefix, msg, detail || '');
    else console.log(prefix, msg, detail || '');
    // Badge aktualisieren
    _updateBadge();
  }

  // ── Öffentliche API ───────────────────────────────────
  const api = {
    info:    (tag, msg, detail) => _add('INFO', tag, msg, detail),
    ok:      (tag, msg, detail) => _add('OK',   tag, msg, detail),
    warn:    (tag, msg, detail) => _add('WARN', tag, msg, detail),
    error:   (tag, msg, detail) => _add('ERR',  tag, msg, detail),
    clear:   () => { localStorage.removeItem(KEY); _updateBadge(); },
    entries: () => _load(),
    errors:  () => _load().filter(e => e.level === 'ERR'),
  };

  // ── Badge (Fehleranzahl) ──────────────────────────────
  function _updateBadge() {
    const btn = document.getElementById('hlog-btn');
    if (!btn) return;
    const cnt = api.errors().length;
    let badge = btn.querySelector('.hlog-badge');
    if (cnt === 0) { badge?.remove(); return; }
    if (!badge) { badge = document.createElement('div'); badge.className = 'hlog-badge'; btn.appendChild(badge); }
    badge.textContent = cnt > 99 ? '!' : cnt;
  }

  // ── UI ────────────────────────────────────────────────
  function _inject() {
    // CSS
    const style = document.createElement('style');
    style.textContent = `
      #hlog-btn {
        position: fixed; bottom: 88px; right: 16px; z-index: 9000;
        width: 40px; height: 40px; border-radius: 12px;
        background: rgba(26,25,33,.92); border: 1px solid #2d2b3d;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; backdrop-filter: blur(8px);
        box-shadow: 0 4px 16px rgba(0,0,0,.4);
        font-size: 17px; user-select: none;
        transition: transform .12s;
      }
      #hlog-btn:active { transform: scale(.9); }
      .hlog-badge {
        position: absolute; top: -5px; right: -5px;
        min-width: 16px; height: 16px; border-radius: 8px;
        background: #e8574a; color: #fff;
        font-size: 9px; font-weight: 800; font-family: sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 0 3px; pointer-events: none;
      }
      #hlog-panel {
        position: fixed; inset: 0; z-index: 9999;
        background: #0e0d12; display: flex; flex-direction: column;
        transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
      }
      #hlog-panel.open { transform: translateY(0); }
      #hlog-topbar {
        display: flex; align-items: center; gap: 10px;
        padding: 14px 16px 0; flex-shrink: 0;
        border-bottom: 1px solid #2d2b3d;
        padding-bottom: 10px;
      }
      #hlog-topbar h2 { font-size: 15px; font-weight: 700; color: #ece8f0; flex: 1; font-family: sans-serif; }
      .hlog-topbtn {
        background: #1a1921; border: 1px solid #2d2b3d; border-radius: 8px;
        color: #7e7a93; font-size: 12px; padding: 5px 10px; cursor: pointer;
        font-family: sans-serif;
      }
      .hlog-topbtn:hover { color: #ece8f0; }
      .hlog-close {
        background: none; border: none; color: #7e7a93;
        font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px;
      }
      #hlog-tabs {
        display: flex; border-bottom: 1px solid #2d2b3d; flex-shrink: 0;
      }
      .hlog-tab {
        flex: 1; padding: 10px; text-align: center;
        font-size: 12px; font-weight: 600; color: #7e7a93;
        cursor: pointer; border-bottom: 2px solid transparent;
        font-family: sans-serif; background: none; border-top: none;
        border-left: none; border-right: none;
        transition: color .15s;
      }
      .hlog-tab.active { color: #ece8f0; border-bottom-color: #f0b429; }
      #hlog-list {
        flex: 1; overflow-y: auto; padding: 4px 0;
      }
      #hlog-empty {
        display: flex; align-items: center; justify-content: center;
        height: 100%; color: #7e7a93; font-size: 13px; font-family: sans-serif;
      }
      .hlog-entry {
        display: flex; gap: 8px; padding: 7px 12px;
        border-bottom: 1px solid rgba(45,43,61,.5);
        cursor: pointer;
      }
      .hlog-entry:hover { background: rgba(26,25,33,.6); }
      .hlog-entry.level-ERR  { background: rgba(232,87,74,.04); }
      .hlog-icon { font-size: 13px; margin-top: 1px; flex-shrink: 0; line-height: 1.5; }
      .hlog-body { flex: 1; min-width: 0; }
      .hlog-meta {
        display: flex; align-items: center; gap: 5px;
        margin-bottom: 2px; flex-wrap: wrap;
      }
      .hlog-ts   { font-size: 10px; color: #7e7a93; font-family: monospace; }
      .hlog-page { font-size: 9px; color: #7e7a93; background: #1a1921;
                   border: 1px solid #2d2b3d; border-radius: 3px;
                   padding: 1px 4px; font-family: monospace; }
      .hlog-tag  { font-size: 10px; font-weight: 700; border-radius: 4px;
                   padding: 1px 5px; font-family: monospace; }
      .hlog-tag.level-INFO { color: #7e7a93; background: rgba(126,122,147,.12); }
      .hlog-tag.level-OK   { color: #1DB954; background: rgba(29,185,84,.12); }
      .hlog-tag.level-WARN { color: #f0b429; background: rgba(240,180,41,.12); }
      .hlog-tag.level-ERR  { color: #e8574a; background: rgba(232,87,74,.12); }
      .hlog-msg  { font-size: 12px; color: #ece8f0; line-height: 1.4; font-family: sans-serif; word-break: break-word; }
      .hlog-detail {
        margin-top: 5px; padding: 7px 9px;
        background: #1a1921; border: 1px solid #2d2b3d; border-radius: 6px;
        font-size: 11px; color: #7e7a93; font-family: monospace;
        white-space: pre-wrap; word-break: break-all; line-height: 1.5;
      }
      .hlog-copied { font-size: 9px; color: #1DB954; margin-left: 4px; }
    `;
    document.head.appendChild(style);

    // Button
    const btn = document.createElement('div');
    btn.id = 'hlog-btn';
    btn.innerHTML = '⌨';
    btn.title = 'Log anzeigen';
    btn.onclick = () => openLog();
    document.body.appendChild(btn);
    _updateBadge();

    // Panel
    const panel = document.createElement('div');
    panel.id = 'hlog-panel';
    panel.innerHTML = `
      <div id="hlog-topbar">
        <h2>Log</h2>
        <button class="hlog-topbtn" onclick="HLog._copyAll()">Alles kopieren</button>
        <button class="hlog-topbtn" onclick="HLog._confirmClear()">Leeren</button>
        <button class="hlog-close" onclick="closeLog()">✕</button>
      </div>
      <div id="hlog-tabs">
        <button class="hlog-tab active" id="hlog-tab-all"    onclick="HLog._showTab('all')">Alle</button>
        <button class="hlog-tab"        id="hlog-tab-errors" onclick="HLog._showTab('errors')">Fehler</button>
      </div>
      <div id="hlog-list"></div>
      <div id="hlog-empty" style="display:none">Keine Einträge</div>
    `;
    document.body.appendChild(panel);
  }

  // ── Log Panel öffnen/schließen ────────────────────────
  let _tab = 'all';
  window.openLog  = () => { _renderList(); document.getElementById('hlog-panel').classList.add('open'); };
  window.closeLog = () => { document.getElementById('hlog-panel').classList.remove('open'); };

  api._showTab = (tab) => {
    _tab = tab;
    document.getElementById('hlog-tab-all')   .classList.toggle('active', tab === 'all');
    document.getElementById('hlog-tab-errors').classList.toggle('active', tab === 'errors');
    _renderList();
  };

  // ── Eintragsliste rendern ─────────────────────────────
  const _icons = { INFO:'ℹ️', OK:'✅', WARN:'⚠️', ERR:'🔴' };

  function _renderList() {
    const list  = document.getElementById('hlog-list');
    const empty = document.getElementById('hlog-empty');
    if (!list) return;
    const raw  = _load();
    const items = (_tab === 'errors' ? raw.filter(e=>e.level==='ERR') : raw).reverse();

    // Fehler-Tab-Label aktualisieren
    const errCnt = raw.filter(e=>e.level==='ERR').length;
    const errTab = document.getElementById('hlog-tab-errors');
    if (errTab) errTab.textContent = errCnt > 0 ? `Fehler (${errCnt})` : 'Fehler';

    if (!items.length) {
      list.innerHTML = '';
      empty.style.display = 'flex';
      empty.textContent = _tab === 'errors' ? 'Keine Fehler 🎉' : 'Noch keine Einträge';
      return;
    }
    empty.style.display = 'none';

    list.innerHTML = items.map((e, i) => `
      <div class="hlog-entry level-${e.level}" onclick="HLog._toggle(${i})" id="hlog-e-${i}">
        <div class="hlog-icon">${_icons[e.level] || 'ℹ️'}</div>
        <div class="hlog-body">
          <div class="hlog-meta">
            <span class="hlog-ts">${e.ts}</span>
            <span class="hlog-page">${e.page}</span>
            <span class="hlog-tag level-${e.level}">${e.tag}</span>
          </div>
          <div class="hlog-msg">${_escHtml(e.msg)}</div>
          ${e.detail ? `<div class="hlog-detail" id="hlog-d-${i}" style="display:none">${_escHtml(e.detail)}</div>` : ''}
        </div>
      </div>
    `).join('');
  }

  api._toggle = (i) => {
    const d = document.getElementById(`hlog-d-${i}`);
    if (d) d.style.display = d.style.display === 'none' ? 'block' : 'none';
  };

  api._copyAll = () => {
    const text = _load().map(e =>
      `[${e.ts}] [${e.level}] [${e.page}] [${e.tag}] ${e.msg}` +
      (e.detail ? `\n  → ${e.detail}` : '')
    ).join('\n');
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('#hlog-topbar .hlog-topbtn');
      if (btn) { const orig = btn.textContent; btn.textContent = '✓ Kopiert'; setTimeout(()=>btn.textContent=orig, 1500); }
    }).catch(() => {});
  };

  api._confirmClear = () => {
    if (confirm('Log wirklich leeren?')) {
      api.clear();
      _renderList();
    }
  };

  function _escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Init nach DOM-ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _inject);
  } else {
    _inject();
  }

  return api;
})();

// ══════════════════════════════════════════════════════
// PARAMS  –  alle aus der URL lesen BEVOR irgendetwas
//            passiert (auch vor einem OAuth-Redirect)
// ══════════════════════════════════════════════════════
const _raw    = new URLSearchParams(window.location.search);
const TRACK_ID = _raw.get('id') || '';
const S_PARAM  = _raw.get('s')  || '';

let songInfo = { title:'', artist:'', year:'' };
try {
  const dec = decodeURIComponent(atob(S_PARAM));
  const [t,a,y] = dec.split('|');
  songInfo = { title:t||'', artist:a||'', year:y||'' };
  HLog.ok('PARAMS', 'Song-Info geparst', `Titel:    ${songInfo.title}\nInterpret: ${songInfo.artist}\nJahr:      ${songInfo.year}\nTrack-ID:  ${TRACK_ID}`);
} catch(e) {
  HLog.error('PARAMS', 'Song-Info Parsing fehlgeschlagen', `s-Param: ${S_PARAM}\nFehler: ${e.message}`);
}

// Saubere Redirect URI – OHNE Query-Params (muss exakt mit Spotify-Dashboard übereinstimmen)
const REDIRECT_URI = window.location.origin + window.location.pathname;

// ══════════════════════════════════════════════════════
// AUTH  –  HitOrder-Token direkt wiederverwenden
// Der Token aus HitOrder hat bereits alle nötigen Scopes
// (streaming, playback-state etc.) – kein separater Login nötig.
// ══════════════════════════════════════════════════════
const CLIENT_ID = localStorage.getItem('sp_client_id') || '';

const getPlayerToken = () => {
  const tok = localStorage.getItem('sp_token');
  const exp = parseInt(localStorage.getItem('sp_exp') || '0');
  return tok && Date.now() < exp - 60000 ? tok : null;
};

async function refreshPlayerToken() {
  const refresh = localStorage.getItem('sp_refresh');
  if (!CLIENT_ID || !refresh) return false;
  HLog.info('AUTH', 'Token wird erneuert…');
  try {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type:    'refresh_token',
        refresh_token: refresh,
        client_id:     CLIENT_ID,
      })
    });
    if (!r.ok) { HLog.error('AUTH', 'Refresh fehlgeschlagen', `HTTP ${r.status}`); return false; }
    const d = await r.json();
    localStorage.setItem('sp_token',   d.access_token);
    localStorage.setItem('sp_exp',     Date.now() + d.expires_in * 1000);
    if (d.refresh_token) localStorage.setItem('sp_refresh', d.refresh_token);
    HLog.ok('AUTH', 'Token erneuert', `expires_in: ${d.expires_in}s`);
    return true;
  } catch(e) { HLog.error('AUTH', 'Refresh Exception', e.message); return false; }
}

async function getValidPlayerToken() {
  const t = getPlayerToken();
  if (t) return t;
  const ok = await refreshPlayerToken();
  return ok ? getPlayerToken() : null;
}

// PKCE helpers
function makeVerifier() {
  const a = new Uint8Array(64); crypto.getRandomValues(a);
  return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function makeChallenge(v) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

async function doAuth() {
  if (!CLIENT_ID) {
    showError('Nicht eingerichtet', 'Öffne HitOrder und verbinde zuerst Spotify unter dem 🎵 Symbol.');
    return;
  }
  const SCOPES = 'playlist-read-private playlist-read-collaborative user-library-read streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state';
  HLog.info('AUTH', 'Starte OAuth (gleiche Keys wie HitOrder)', `redirect_uri: ${REDIRECT_URI}`);
  sessionStorage.setItem('sp_p_pending', JSON.stringify({ trackId: TRACK_ID, sParam: S_PARAM }));
  const v = makeVerifier();
  const c = await makeChallenge(v);
  localStorage.setItem('sp_verifier', v);
  const params = new URLSearchParams({
    client_id:             CLIENT_ID,
    response_type:         'code',
    redirect_uri:          REDIRECT_URI,
    code_challenge_method: 'S256',
    code_challenge:        c,
    scope:                 SCOPES,
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + params;
}

// OAuth Callback – nur verarbeiten wenn ?code vorhanden
async function handleCallback(code) {
  const verifier = localStorage.getItem('sp_verifier');
  HLog.info('AUTH', 'OAuth Callback', `code: ${code.slice(0,8)}…  redirect_uri: ${REDIRECT_URI}`);
  if (!CLIENT_ID || !verifier) {
    HLog.error('AUTH', 'Auth-Fehler: CLIENT_ID oder verifier fehlt', `CLIENT_ID: ${!!CLIENT_ID}  verifier: ${!!verifier}`);
    showError('Auth-Fehler', 'Bitte Seite neu laden.'); return false;
  }
  const SCOPES = 'playlist-read-private playlist-read-collaborative user-library-read streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state';
  try {
    const t0 = Date.now();
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code', code,
        redirect_uri: REDIRECT_URI, client_id: CLIENT_ID, code_verifier: verifier,
      })
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error_description || 'Token-Fehler'); }
    const d = await r.json();
    localStorage.setItem('sp_token',   d.access_token);
    localStorage.setItem('sp_exp',     Date.now() + d.expires_in * 1000);
    if (d.refresh_token) localStorage.setItem('sp_refresh', d.refresh_token);
    HLog.ok('AUTH', 'Token erhalten (shared mit HitOrder)', `expires_in: ${d.expires_in}s  Dauer: ${Date.now()-t0}ms`);
    const pending = JSON.parse(sessionStorage.getItem('sp_p_pending') || '{}');
    sessionStorage.removeItem('sp_p_pending');
    HLog.info('AUTH', 'Weiterleitung mit Track-Params', `trackId: ${pending.trackId || '–'}`);
    window.location.replace(
      window.location.pathname +
      '?id=' + encodeURIComponent(pending.trackId || '') +
      '&s='  + encodeURIComponent(pending.sParam  || '')
    );
    return true;
  } catch(e) { HLog.error('AUTH', 'OAuth fehlgeschlagen', e.message); showError('Anmeldung fehlgeschlagen', e.message); return false; }
}

// ══════════════════════════════════════════════════════
// SCREENS
// ══════════════════════════════════════════════════════
function showScreen(id) {
  ['screen-auth','screen-player','screen-error'].forEach(s =>
    document.getElementById(s).classList.toggle('hidden', s !== id)
  );
}
function showError(title, sub) {
  document.getElementById('err-title').textContent = title;
  document.getElementById('err-sub').textContent   = sub;
  showScreen('screen-error');
}

// ══════════════════════════════════════════════════════
// SPOTIFY WEB PLAYBACK SDK
// ══════════════════════════════════════════════════════
let player     = null;
let deviceId   = null;
let isPlaying  = false;
let trackDur   = 0;
let trackPos   = 0;
let posTimer   = null;

// SDK wird erst jetzt geladen (nachdem Auth gesichert ist)
function loadSDK(token) {
  window.onSpotifyWebPlaybackSDKReady = () => initPlayer(token);
  const s = document.createElement('script');
  s.src = 'https://sdk.scdn.co/spotify-player.js';
  document.head.appendChild(s);
}

function initPlayer(token) {
  player = new Spotify.Player({
    name: 'HitOrder Player',
    getOAuthToken: async cb => {
      const t = await getValidPlayerToken();
      cb(t || '');
    },
    volume: 0.85
  });

  player.addListener('ready', ({ device_id }) => {
    deviceId = device_id;
    HLog.ok('SDK', 'Player bereit', `device_id: ${device_id}`);
    startPlayback();
  });

  player.addListener('not_ready', ({ device_id }) => {
    HLog.warn('SDK', 'Player nicht bereit', `device_id: ${device_id}`);
    setPlayBtn(false, false);
  });

  let _firstState = true;
  player.addListener('player_state_changed', state => {
    if (!state) { HLog.warn('SDK', 'Leerer player_state empfangen'); return; }
    const wasPlaying = isPlaying;
    isPlaying = !state.paused;
    trackDur  = state.duration;
    trackPos  = state.position;
    if (_firstState) {
      _firstState = false;
      HLog.ok('SDK', 'Erste Wiedergabe-State', `Track:    ${state.track_window?.current_track?.name || '?'}\nArtist:   ${state.track_window?.current_track?.artists?.map(a=>a.name).join(', ') || '?'}\nDuration: ${Math.floor(state.duration/60000)}:${String(Math.floor((state.duration%60000)/1000)).padStart(2,'0')}\nPlaying:  ${!state.paused}\nPosition: ${Math.floor(state.position/1000)}s`);
    } else if (wasPlaying !== isPlaying) {
      HLog.info('SDK', isPlaying ? 'Wiedergabe gestartet' : 'Wiedergabe pausiert',
        `Position: ${Math.floor(trackPos/1000)}s / ${Math.floor(trackDur/1000)}s`);
    }
    setPlayBtn(true, isPlaying);
    document.getElementById('waveform').classList.toggle('paused', !isPlaying);
    updateProgress(trackPos, trackDur);
    isPlaying ? startPosTimer() : stopPosTimer();
  });

  player.addListener('initialization_error', ({ message }) => { HLog.error('SDK', 'Initialisierungsfehler', message); showError('SDK-Fehler', message); });
  player.addListener('authentication_error',  ({ message }) => { HLog.error('SDK', 'Authentifizierungsfehler', message); showError('Auth abgelaufen', 'Bitte Seite neu laden.'); });
  player.addListener('account_error',         ({ message }) => { HLog.error('SDK', 'Account-Fehler (Premium?)', message); showError('Kein Spotify Premium', 'Premium ist für die Wiedergabe erforderlich.'); });

  HLog.info('SDK', 'player.connect() wird aufgerufen…');
  player.connect();
}

async function startPlayback() {
  showScreen('screen-player');
  const token = await getValidPlayerToken();
  if (!token) { HLog.error('PLAYER', 'Kein Token beim Starten der Wiedergabe'); showError('Token abgelaufen', 'Bitte Seite neu laden.'); return; }
  HLog.info('PLAYER', 'Starte Wiedergabe via API', `track: spotify:track:${TRACK_ID}\ndevice_id: ${deviceId}`);
  try {
    const t0 = Date.now();
    const r = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ uris: ['spotify:track:' + TRACK_ID] })
    });
    if (!r.ok && r.status !== 204 && r.status !== 202) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.error?.message || `HTTP ${r.status}`);
    }
    HLog.ok('PLAYER', `Wiedergabe gestartet`, `HTTP ${r.status}  Dauer: ${Date.now()-t0}ms`);
  } catch(e) { HLog.error('PLAYER', 'Wiedergabe fehlgeschlagen', e.message); showError('Wiedergabe fehlgeschlagen', e.message); }
}

// ── Transport ─────────────────────────────────────────
async function togglePlay() {
  if (!player) return;
  await player.togglePlay();
}

async function seekRel(ms) {
  if (!player) return;
  const st = await player.getCurrentState();
  if (!st) return;
  const target = Math.max(0, Math.min(st.duration, st.position + ms));
  HLog.info('PLAYER', `Seek ${ms > 0 ? '+' : ''}${ms/1000}s`, `${Math.floor(st.position/1000)}s → ${Math.floor(target/1000)}s / ${Math.floor(st.duration/1000)}s`);
  await player.seek(target);
}

async function seekClick(e) {
  if (!player || !trackDur) return;
  const rect = document.getElementById('prog-bg').getBoundingClientRect();
  const pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  await player.seek(Math.round(pct * trackDur));
}

// ── UI ────────────────────────────────────────────────
function setPlayBtn(ready, playing) {
  const btn = document.getElementById('play-btn');
  const sp  = document.getElementById('btn-spin');
  btn.classList.toggle('loading', !ready);
  sp.style.display    = ready ? 'none' : 'block';
  btn.childNodes[btn.childNodes.length-1]?.remove?.();
  if (ready) {
    btn.innerHTML = playing ? '⏸' : '▶';
  } else {
    btn.innerHTML = '<div class="spin"></div>';
  }
}

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function updateProgress(pos, dur) {
  const pct = dur > 0 ? (pos/dur)*100 : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('t-cur').textContent = fmt(pos);
  document.getElementById('t-tot').textContent = fmt(dur);
}

function startPosTimer() {
  stopPosTimer();
  posTimer = setInterval(() => {
    if (!isPlaying) return;
    trackPos = Math.min(trackPos + 500, trackDur);
    updateProgress(trackPos, trackDur);
  }, 500);
}
function stopPosTimer() {
  clearInterval(posTimer); posTimer = null;
}

// ── Solution ──────────────────────────────────────────
function showSolution() {
  document.getElementById('sol-year').textContent   = songInfo.year   || '–';
  document.getElementById('sol-title').textContent  = songInfo.title  || '–';
  document.getElementById('sol-artist').textContent = songInfo.artist || '–';
  document.getElementById('solution-panel').classList.add('show');
  HLog.ok('PLAYER', 'Lösung angezeigt', `Titel:    ${songInfo.title}\nInterpret: ${songInfo.artist}\nJahr:      ${songInfo.year}\nPosition:  ${Math.floor(trackPos/1000)}s / ${Math.floor(trackDur/1000)}s`);
}
function closeSolution() {
  document.getElementById('solution-panel').classList.remove('show');
}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
(async () => {
  HLog.info('INIT', 'Player gestartet', `url: ${window.location.href.slice(0, 100)}`);

  // 1. Fehler: keine Track-ID
  if (!TRACK_ID) {
    const received = window.location.href;
    HLog.error('INIT', 'Kein "id"-Parameter in der URL', `Empfangen: ${received}`);
    const short = received.length > 80 ? received.slice(0,80)+'…' : received;
    showError(
      'Ungültiger QR-Code',
      'Kein "id"-Parameter gefunden.

Empfangene URL:
' + short +
      '

Bitte PDF neu erstellen und QR-Code neu scannen.'
    );
    return;
  }
  HLog.info('INIT', 'Parameter OK', `TRACK_ID: ${TRACK_ID}  songInfo: ${songInfo.title} – ${songInfo.artist} (${songInfo.year})`);

  // 2. HitOrder nicht eingerichtet
  if (!CLIENT_ID) {
    HLog.error('INIT', 'Keine Client ID gespeichert', 'localStorage sp_client_id fehlt');
    showError('HitOrder nicht eingerichtet', 'Öffne HitOrder und verbinde Spotify unter dem 🎵 Symbol.');
    return;
  }

  // 3. OAuth Callback
  const code  = _raw.get('code');
  const oerr  = _raw.get('error');
  if (oerr) { HLog.error('INIT', 'OAuth abgebrochen', oerr); showError('Anmeldung abgebrochen', ''); return; }
  if (code) {
    HLog.info('INIT', 'OAuth Code empfangen', `code: ${code.slice(0,8)}…`);
    const ok = await handleCallback(code);
    if (!ok) return;
  }

  // 4. Token prüfen
  let token = await getValidPlayerToken();
  if (!token) {
    HLog.warn('INIT', 'Kein gültiger Token – zeige Auth-Screen');
    showScreen('screen-auth');
    return;
  }
  HLog.ok('INIT', 'Token gültig – lade SDK');

  // 5. SDK laden & Player starten
  loadSDK(token);
})();
</script>
